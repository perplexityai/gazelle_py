agents:
  queue: oss

steps:
  - label: "bazel 9.0.0 test (linux-x86_64)"
    key: bazel-test-9-0-0
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh test
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "9.0.0"
    timeout_in_minutes: 60
    artifact_paths: "bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml"

  - label: "bazel 8.6.0 test (linux-x86_64)"
    key: bazel-test-8-6-0
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh test
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "8.6.0"
    timeout_in_minutes: 60
    artifact_paths: "bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml"

  - label: "examples / bazel 9.0.0"
    key: examples-9-0-0
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh examples
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "9.0.0"
    timeout_in_minutes: 60
    artifact_paths: "examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml"

  - label: "examples / bazel 8.6.0"
    key: examples-8-6-0
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh examples
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "8.6.0"
    timeout_in_minutes: 60
    artifact_paths: "examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml"

  - label: "macOS smoke / bazel 9.0.0"
    key: macos-smoke-9-0-0
    if: build.pull_request.id == null
    agents:
      queue: oss_darwin_arm64
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh smoke
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "9.0.0"
    timeout_in_minutes: 60
    artifact_paths: "bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml"

  - label: "macOS smoke / bazel 8.6.0"
    key: macos-smoke-8-6-0
    if: build.pull_request.id == null
    agents:
      queue: oss_darwin_arm64
    command:
      - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
      - bash .buildkite/bazel.sh smoke
      - buildkite-agent cache save --registry oss-ci-v2 --name bazel
    env:
      USE_BAZEL_VERSION: "8.6.0"
    timeout_in_minutes: 60
    artifact_paths: "bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml"

  - label: "Verify commit hooks"
    key: verify-hooks
    command: "bash .buildkite/verify-hooks.sh"
    timeout_in_minutes: 10

notify:
- github_commit_status:
    context: release-ready/gazelle-py
    blocked_builds_as_pending: true
  if: build.branch == "main" && build.pull_request.id == null && build.tag == null
