---
name: module-release
'on':
  push:
    tags:
    - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0). Must already exist.
        type: string
        required: true
permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
jobs:
  gha:
    name: Verify release commit on GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    outputs:
      commit: "${{ steps.gate.outputs.commit }}"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: "${{ inputs.tag || github.ref_name }}"
        fetch-depth: 0
    - name: Wait for exact main GitHub Actions build
      id: gate
      env:
        GH_TOKEN: "${{ github.token }}"
        RELEASE_TAG: "${{ inputs.tag || github.ref_name }}"
      run: python3 .github/scripts/gha-release-gate.py
  release:
    needs: gha
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.4.0
    with:
      bazel_test_command: python3 .github/scripts/gha-release-gate.py --expected-commit
        ${{ needs.gha.outputs.commit }}
      mount_bazel_caches: false
      release_files: gazelle_py-*.tar.gz
      prerelease: false
      tag_name: "${{ inputs.tag || github.ref_name }}"
  publish-to-bcr:
    needs: release
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: "${{ inputs.tag || github.ref_name }}"
      registry_fork: perplexityai/bazel-central-registry
      draft: false
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: "${{ secrets.BCR_PUBLISH_TOKEN }}"
