---
name: ci
'on':
  push:
    branches:
    - main
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: false
        default: ''
permissions:
  actions: read
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
env:
  CI_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
  CI_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
    github.run_id }}"
jobs:
  bazel-test-9-0-0:
    name: bazel 9.0.0 test (linux-x86_64)
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-bazel-test-9-0-0-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: gazelle_py-${{ runner.os }}-bazel-test-9-0-0-
    - name: Run checks
      run: bash .github/ci/bazel.sh test
      shell: bash
  bazel-test-8-6-0:
    name: bazel 8.6.0 test (linux-x86_64)
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-bazel-test-8-6-0-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: gazelle_py-${{ runner.os }}-bazel-test-8-6-0-
    - name: Run checks
      run: bash .github/ci/bazel.sh test
      shell: bash
  examples-9-0-0:
    name: examples / bazel 9.0.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-examples-9-0-0-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: gazelle_py-${{ runner.os }}-examples-9-0-0-
    - name: Run checks
      run: bash .github/ci/bazel.sh examples
      shell: bash
  examples-8-6-0:
    name: examples / bazel 8.6.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-examples-8-6-0-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: gazelle_py-${{ runner.os }}-examples-8-6-0-
    - name: Run checks
      run: bash .github/ci/bazel.sh examples
      shell: bash
  verify-hooks:
    name: Verify commit hooks
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-verify-hooks-${{ github.run_id }}-${{ github.run_attempt
          }}
        restore-keys: gazelle_py-${{ runner.os }}-verify-hooks-
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
    - name: Run checks
      run: |-
        python3 -B .github/scripts/test-gha-release-gate.py
        bash .github/ci/verify-hooks.sh
      shell: bash
    env:
      CI_CACHE_DIR: "/tmp/oss-ci"
  smoke-build-9-0-0:
    name: Cross-build smoke binaries / Bazel 9.0.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-smoke-build-9-0-0-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: gazelle_py-${{ runner.os }}-smoke-build-9-0-0-
    - name: Run checks
      run: bash .github/ci/build-smoke.sh
      shell: bash
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: smoke-9.0.0
        path: ".ci-artifacts/smoke/9.0.0"
        if-no-files-found: error
        include-hidden-files: true
  artifact-smoke-oss-9-0-0:
    name: Artifact smoke / Linux AMD64 / Bazel 9.0.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-9-0-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-9.0.0
        path: ".ci-artifacts/smoke/9.0.0"
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
  artifact-smoke-oss_darwin_arm64-9-0-0:
    name: Artifact smoke / macOS ARM64 / Bazel 9.0.0
    runs-on: macos-15
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-9-0-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-9.0.0
        path: ".ci-artifacts/smoke/9.0.0"
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
  smoke-build-8-6-0:
    name: Cross-build smoke binaries / Bazel 8.6.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: "${{ env.CI_CACHE_DIR }}"
        key: gazelle_py-${{ runner.os }}-smoke-build-8-6-0-${{ github.run_id }}-${{
          github.run_attempt }}
        restore-keys: gazelle_py-${{ runner.os }}-smoke-build-8-6-0-
    - name: Run checks
      run: bash .github/ci/build-smoke.sh
      shell: bash
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: smoke-8.6.0
        path: ".ci-artifacts/smoke/8.6.0"
        if-no-files-found: error
        include-hidden-files: true
  artifact-smoke-oss-8-6-0:
    name: Artifact smoke / Linux AMD64 / Bazel 8.6.0
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-8-6-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-8.6.0
        path: ".ci-artifacts/smoke/8.6.0"
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
  artifact-smoke-oss_darwin_arm64-8-6-0:
    name: Artifact smoke / macOS ARM64 / Bazel 8.6.0
    runs-on: macos-15
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-8-6-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-8.6.0
        path: ".ci-artifacts/smoke/8.6.0"
    - name: Run checks
      run: bash .github/ci/smoke.sh
      shell: bash
  artifact-smoke-windows-amd64-9-0-0:
    name: Artifact smoke / Windows AMD64 / Bazel 9.0.0
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 9.0.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-9-0-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-9.0.0
        path: ".ci-artifacts/smoke/9.0.0"
    - name: Run checks
      run: pwsh -NoProfile -File .github/ci/smoke-windows.ps1
      shell: pwsh
  artifact-smoke-windows-amd64-8-6-0:
    name: Artifact smoke / Windows AMD64 / Bazel 8.6.0
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      USE_BAZEL_VERSION: 8.6.0
      CI_CACHE_DIR: "/tmp/oss-ci"
    needs: smoke-build-8-6-0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        ref: "${{ inputs.ref || github.sha }}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: smoke-8.6.0
        path: ".ci-artifacts/smoke/8.6.0"
    - name: Run checks
      run: pwsh -NoProfile -File .github/ci/smoke-windows.ps1
      shell: pwsh
  ci:
    name: CI
    if: "${{ always() }}"
    needs:
    - bazel-test-9-0-0
    - bazel-test-8-6-0
    - examples-9-0-0
    - examples-8-6-0
    - verify-hooks
    - smoke-build-9-0-0
    - artifact-smoke-oss-9-0-0
    - artifact-smoke-oss_darwin_arm64-9-0-0
    - smoke-build-8-6-0
    - artifact-smoke-oss-8-6-0
    - artifact-smoke-oss_darwin_arm64-8-6-0
    - artifact-smoke-windows-amd64-9-0-0
    - artifact-smoke-windows-amd64-8-6-0
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULTS: "${{ toJSON(needs) }}"
      run: |-
        python3 - <<'CHECK'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = [name for name, job in results.items() if job['result'] != 'success']
        if failed:
            raise SystemExit('Failed or skipped checks: ' + ', '.join(failed))
        CHECK
